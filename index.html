<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="description" content="Flipper arcade : 4 tables, missions, multiball.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Odyssée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Odyssée Pinball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@500;700&family=Doto:wght@800;900&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
/*
VOICE: arcade cabinet, glossy and loud, every table a different world.
IDEA: a real pinball cabinet — dot-matrix display on top, lit playfield below, ramps in clear plastic.
PICTURE: the playfield itself, illustrated per theme (space, volcano, abyss, meadow).
COLOUR and TYPE: each table owns its palette; DMD dots in the table colour; Audiowide + Chakra Petch + Doto.
LAYOUT: DMD band, playfield filling the rest; menu of four cabinet cards.
*/
:root{color-scheme:dark;--dmd:#5fe0ff;--acc:#5fe0ff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:#050508;color:#eef1ff;font:16px/1.45 'Chakra Petch',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:
 linear-gradient(90deg,#16110c 0,#2a1f16 10px,#0c0a08 14px,transparent 15px,transparent calc(100% - 15px),#0c0a08 calc(100% - 14px),#2a1f16 calc(100% - 10px),#16110c 100%),
 radial-gradient(120% 70% at 50% 0,#1a1b2e 0,#07070c 70%)}
#dmd{position:relative;flex:none;height:68px;margin:max(4px,env(safe-area-inset-top)) 10px 2px;border-radius:10px;background:#0b0705;border:2px solid #2b2b33;box-shadow:inset 0 0 18px #000,0 2px 0 #3a3a44;overflow:hidden;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
#dmd::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;pointer-events:none;background:radial-gradient(circle,transparent 45%,#0b0705 72%) 0 0/4px 4px;opacity:.8}
.dmdc{text-align:center;color:var(--dmd);text-shadow:0 0 3px color-mix(in srgb,var(--dmd) 55%,transparent);-webkit-font-smoothing:antialiased;font-family:'Doto','VT323',ui-monospace,monospace;font-weight:900;line-height:1}
#dmdScore{font-size:30px;letter-spacing:1px;white-space:nowrap}
#dmdInfo{font:700 16px/1.1 'Chakra Petch',system-ui,sans-serif;margin-top:4px;white-space:nowrap;overflow:hidden;letter-spacing:.4px;text-shadow:none;color:color-mix(in srgb,var(--dmd) 80%,#fff)}
#dmdRow{display:flex;align-items:center;gap:8px;width:86%;margin:4px auto 0;opacity:0;transition:opacity .3s}#dmdRow.on{opacity:1}#dmdMeta{font:700 13px 'Chakra Petch',sans-serif;white-space:nowrap;text-shadow:none;color:color-mix(in srgb,var(--dmd) 80%,#fff)}
#dmdBar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--dmd) 18%,transparent);overflow:hidden;opacity:0;transition:opacity .3s}#dmdBar{opacity:1}#dmdBar i{display:block;height:100%;width:0;background:var(--dmd);box-shadow:0 0 8px var(--dmd);transition:width .25s}
#dmd{height:80px!important}
#dmdInfo.flash{animation:fl .25s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
.ib{position:relative;z-index:2;width:40px;height:40px;margin:0 2px;border:0;border-radius:8px;background:transparent;color:var(--dmd);font:700 18px 'Chakra Petch',sans-serif;cursor:pointer;opacity:.85}
.ib:focus-visible{outline:2px solid var(--dmd)}
#stage{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;perspective:1100px;perspective-origin:50% 30%;overflow:hidden;touch-action:none;padding-bottom:max(2px,env(safe-area-inset-bottom))}
#tilt{transform-origin:50% 100%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.v3d #tilt{transform:rotateX(17deg)}
#cv{display:block;border-radius:6px;box-shadow:0 0 0 3px #1c1c22,0 0 0 5px #3d3d48,0 30px 60px #000}
.hint{position:absolute;bottom:18px;width:44%;padding:10px;border-radius:12px;background:rgba(0,0,0,.45);border:1px dashed rgba(255,255,255,.3);font-size:13px;text-align:center;color:#dfe6ff;pointer-events:none;transition:opacity .8s}
.hint.l{left:3%}.hint.r{right:3%}.hint.off{opacity:0}
.ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;touch-action:pan-y;padding:max(16px,env(safe-area-inset-top)) 14px 28px;background:radial-gradient(90% 60% at 50% 0,#22183f 0,#0a0912 60%,#050508 100%)}
.ov.dim{background:rgba(4,4,10,.82);backdrop-filter:blur(6px);justify-content:center}
.hide{display:none!important}
h1{font:400 clamp(30px,8vw,52px)/1.02 'Audiowide',sans-serif;margin:6px 0 4px;text-align:center;background:linear-gradient(180deg,#fff 0,#9fe8ff 45%,#ff6fe0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(120,200,255,.35));text-wrap:balance}
.sub{margin:0 0 14px;color:#aab3d6;font-size:15px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2.2vw,16px);width:100%;max-width:900px}
@media(max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;padding:8px 8px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c);outline:none;box-shadow:0 0 24px color-mix(in srgb,var(--c) 35%,transparent)}
.card canvas{width:100%;aspect-ratio:500/1080;border-radius:8px;display:block;background:#000}
.card b{display:block;font:400 clamp(15px,3.8vw,20px)/1.1 'Audiowide',sans-serif;margin:8px 0 4px;color:var(--c)}
.tag{position:absolute;top:14px;left:14px;padding:3px 9px;border-radius:10px;background:#ffd23f;color:#3a2600;font:600 12px 'Fredoka','Chakra Petch',sans-serif}
.pips{display:flex;gap:4px;align-items:center;font-size:12px;color:#cfd6f5}
.pips i{width:clamp(10px,2.6vw,16px);height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.pips i.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.meta{font-size:12px;color:#9aa3c7;margin-top:4px;line-height:1.3}
.rec{font-size:13px;margin-top:4px;color:#fff;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.lbl{width:100%;text-align:center;font-size:13px;color:#9aa3c7;margin:6px 0 -2px}
.pill{min-height:44px;padding:0 15px;border-radius:22px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#dfe5ff;font:700 14px 'Chakra Petch',sans-serif;cursor:pointer}
.pill[aria-pressed=true]{background:#e9f6ff;color:#0a0a14;border-color:#e9f6ff}
.pill:focus-visible,.btn:focus-visible{outline:2px solid #9fe8ff;outline-offset:2px}
.help{max-width:560px;font-size:13px;color:#9aa3c7;text-align:center;margin-top:8px}
.help kbd{font:700 12px 'Chakra Petch',sans-serif;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.12);color:#fff}
.panel{width:min(380px,92vw);padding:22px 18px;border-radius:18px;background:linear-gradient(180deg,#171a2c,#0d0e18);border:1px solid rgba(255,255,255,.12);text-align:center;box-shadow:0 20px 60px #000}
.panel h2{font:400 25px/1.1 'Audiowide',sans-serif;margin:0 0 10px;color:var(--acc)}
.big{font:900 40px/1.1 'Doto',ui-monospace,monospace;color:var(--dmd);text-shadow:0 0 12px var(--dmd);margin:6px 0}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{min-height:48px;border-radius:12px;border:0;font:700 16px 'Chakra Petch',sans-serif;cursor:pointer;background:rgba(255,255,255,.08);color:#fff}
.btn.p{background:var(--acc);color:#05060c}
.newrec{color:#ffe45c;font-weight:700}
.coll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.coll div{background:rgba(255,255,255,.05);border-radius:10px;padding:4px 2px 6px;font:600 11px 'Fredoka',sans-serif;color:#dfe6ff}
.coll canvas{width:100%;aspect-ratio:1;display:block}
@media (prefers-reduced-motion:reduce){#tilt,.card{transition:none}}
</style>
</head>
<body>
<div id="app" class="v3d">
  <header id="dmd">
    <button class="ib" id="menuBtn" aria-label="Pause">II</button>
    <div class="dmdc"><div id="dmdScore">ODYSSÉE</div><div id="dmdInfo">CHOISIS UNE TABLE</div><div id="dmdRow"><div id="dmdBar"><i></i></div><span id="dmdMeta"></span></div></div>
    <button class="ib" id="sndBtn" aria-label="Son">♪</button>
  </header>
  <div id="stage">
    <div id="tilt"><canvas id="cv" width="500" height="1080"></canvas></div>
    <div class="hint l off" id="hintL">◀ Toucher ici<br>flipper gauche</div>
    <div class="hint r off" id="hintR">Toucher ici ▶<br>flipper droit · maintenir = lancer</div>
  </div>

  <section class="ov" id="menu">
    <h1>ODYSSÉE PINBALL</h1>
    <p class="sub">Quatre tables, des missions, une seule physique.</p>
    <div class="cards" id="cards"></div>
    <div class="row">
      <div class="lbl">Gravité (moins forte = la bille descend plus lentement)</div>
      <button class="pill gv" data-g="1">Normale</button>
      <button class="pill gv" data-g="0.7">Douce</button>
      <button class="pill gv" data-g="0.5">Très douce</button>
    </div>
    <div class="row">
      <button class="pill" id="tSnd" aria-pressed="true">Sons</button>
      <button class="pill" id="tMus" aria-pressed="true">Musique</button>
      <button class="pill" id="t3d" aria-pressed="true">Vue 3D</button>
      <button class="pill" id="tLit" aria-pressed="true">Lumières dynamiques</button>
      <button class="pill" id="tColl">Collection de créatures</button>
    </div>
    <p class="help" id="help"></p>
  </section>

  <section class="ov dim hide" id="pause">
    <div class="panel">
      <h2>Pause</h2>
      <div class="row" style="margin-top:4px">
        <div class="lbl">Gravité</div>
        <button class="pill gv" data-g="1">Normale</button>
        <button class="pill gv" data-g="0.7">Douce</button>
        <button class="pill gv" data-g="0.5">Très douce</button>
      </div>
      <div class="row">
        <button class="pill" id="pSnd" aria-pressed="true">Sons</button>
        <button class="pill" id="pMus" aria-pressed="true">Musique</button>
        <button class="pill" id="p3d" aria-pressed="true">Vue 3D</button>
        <button class="pill" id="pLit" aria-pressed="true">Lumières</button>
      </div>
      <div class="btns">
        <button class="btn p" id="resume">Reprendre</button>
        <button class="btn" id="restart">Recommencer</button>
        <button class="btn" id="toMenu">Changer de table</button>
      </div>
    </div>
  </section>

  <section class="ov dim hide" id="over">
    <div class="panel">
      <h2 id="overT">Partie terminée</h2>
      <div class="big" id="overS">0</div>
      <div id="overG" class="meta" style="font-size:15px;color:#fff"></div>
      <div id="overR" class="meta"></div>
      <div class="btns">
        <button class="btn p" id="again">Rejouer</button>
        <button class="btn" id="over2menu">Changer de table</button>
      </div>
    </div>
  </section>

  <section class="ov dim hide" id="collOv">
    <div class="panel" style="width:min(460px,94vw)">
      <h2 style="color:#ffd23f">Collection</h2>
      <div class="meta" id="collN"></div>
      <div class="coll" id="collGrid"></div>
      <div class="btns"><button class="btn p" id="collClose" style="background:#ffd23f">Fermer</button></div>
    </div>
  </section>
</div>

<script>
{
/* ================= CONSTANTES PHYSIQUES (identiques pour toutes les tables) ================= */
const W=500,DY=140,H=940+DY,R=11,GRAV=1500,MAXV=2900;
const FL_LEN=72,FL_R1=11,FL_R2=6,FL_REST=0.5,FL_UP=-0.42,FL_UPSPD=32,FL_DNSPD=20,FL_E=0.28;
const SLING_KICK=640,BUMP_OUT=980,PLUNGE_MIN=1800,PLUNGE_MAX=2450;
const CX=234,LANE_X=464,PLUNGER_Y=900+DY;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const fmt=n=>Math.round(n).toLocaleString('fr-FR').replace(/ | /g,' ');
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function smooth(p,seg=8){const o=[];for(let i=0;i<p.length-1;i++){const a=p[Math.max(0,i-1)],b=p[i],c=p[i+1],d=p[Math.min(p.length-1,i+2)];for(let k=0;k<seg;k++){const t=k/seg,t2=t*t,t3=t2*t;o.push(b.map((_,j)=>0.5*(2*b[j]+(-a[j]+c[j])*t+(2*a[j]-5*b[j]+4*c[j]-d[j])*t2+(-a[j]+3*b[j]-3*c[j]+d[j])*t3)))}}o.push(p[p.length-1]);return o}
function offsetPath(P,d){return P.map((p,i)=>{const a=P[Math.max(0,i-1)],b=P[Math.min(P.length-1,i+1)],tx=b[0]-a[0],ty=b[1]-a[1],l=Math.hypot(tx,ty)||1;return[p[0]-ty/l*d,p[1]+tx/l*d]})}

/* ================= CRÉATURES (originales) ================= */
const CREAT=[
 {n:'Pompon',c:'#ffb3c7',b:'#fff0f4',ears:'bunny',tail:'fluffy',eyes:'big',pat:''},
 {n:'Frimousse',c:'#ff9f43',b:'#ffe2c2',ears:'cat',tail:'fluffy',eyes:'happy',pat:'stripes'},
 {n:'Patapouf',c:'#8fd16a',b:'#e2f7d0',ears:'leaf',tail:'',eyes:'sleepy',pat:'spots'},
 {n:'Zigzou',c:'#a17cff',b:'#e9e0ff',ears:'antenna',tail:'zig',eyes:'big',pat:''},
 {n:'Cacahuète',c:'#c58b5a',b:'#f3dcc4',ears:'round',tail:'curl',eyes:'happy',pat:''},
 {n:'Flocon',c:'#bfe9ff',b:'#ffffff',ears:'horns',tail:'',eyes:'big',pat:'spots'},
 {n:'Brindille',c:'#3fae6a',b:'#d4f0c0',ears:'leaf',tail:'curl',eyes:'happy',pat:'stripes'},
 {n:'Grelot',c:'#ffcf3f',b:'#fff6c9',ears:'horns',tail:'fluffy',eyes:'sleepy',pat:'spots'},
 {n:'Caramel',c:'#e17055',b:'#ffd8cc',ears:'cat',tail:'curl',eyes:'big',pat:'spots'},
 {n:'Nuage',c:'#dfe6e9',b:'#ffffff',ears:'',tail:'fluffy',eyes:'sleepy',pat:''},
 {n:'Biscotte',c:'#f6c177',b:'#fff1d6',ears:'bunny',tail:'',eyes:'happy',pat:'stripes'},
 {n:'Tornade',c:'#00cec9',b:'#c9fffd',ears:'fins',tail:'zig',eyes:'big',pat:''}
];
function drawCreature(x,cx,cy,s,k,sil){
 const C=CREAT[k],F=c=>sil?'#10261a':c,lw=s*0.05;x.save();x.translate(cx,cy);x.lineJoin='round';x.lineCap='round';
 const st=()=>{if(!sil){x.strokeStyle='rgba(40,20,30,.7)';x.lineWidth=lw;x.stroke()}};
 // queue
 x.fillStyle=F(C.c);
 if(C.tail==='fluffy'){x.beginPath();x.arc(s*0.5,s*0.18,s*0.2,0,7);x.fill();st()}
 else if(C.tail==='zig'){x.beginPath();x.moveTo(s*0.3,s*0.2);x.lineTo(s*0.6,s*0.05);x.lineTo(s*0.5,-s*0.08);x.lineTo(s*0.78,-s*0.25);x.lineTo(s*0.62,-s*0.02);x.lineTo(s*0.72,0.04*s);x.lineTo(s*0.34,s*0.3);x.closePath();x.fill();st()}
 else if(C.tail==='curl'){x.strokeStyle=F(C.c);x.lineWidth=s*0.1;x.beginPath();x.arc(s*0.52,s*0.05,s*0.14,Math.PI*0.6,Math.PI*2.3);x.stroke()}
 // oreilles
 const ear=(m)=>{x.save();x.scale(m,1);x.fillStyle=F(C.c);x.beginPath();
  if(C.ears==='bunny'){x.ellipse(-s*0.18,-s*0.55,s*0.09,s*0.26,-0.15,0,7);x.fill();st();if(!sil){x.fillStyle=C.b;x.beginPath();x.ellipse(-s*0.18,-s*0.55,s*0.045,s*0.17,-0.15,0,7);x.fill()}}
  else if(C.ears==='cat'){x.moveTo(-s*0.32,-s*0.22);x.lineTo(-s*0.28,-s*0.56);x.lineTo(-s*0.06,-s*0.36);x.closePath();x.fill();st()}
  else if(C.ears==='round'){x.arc(-s*0.27,-s*0.36,s*0.13,0,7);x.fill();st()}
  else if(C.ears==='horns'){x.fillStyle=F('#fff7e0');x.moveTo(-s*0.2,-s*0.34);x.quadraticCurveTo(-s*0.3,-s*0.6,-s*0.12,-s*0.62);x.quadraticCurveTo(-s*0.16,-s*0.48,-s*0.06,-s*0.38);x.closePath();x.fill();st()}
  else if(C.ears==='antenna'){x.strokeStyle=F(C.c);x.lineWidth=s*0.05;x.moveTo(-s*0.1,-s*0.36);x.quadraticCurveTo(-s*0.2,-s*0.6,-s*0.28,-s*0.62);x.stroke();x.fillStyle=F('#fff27a');x.beginPath();x.arc(-s*0.28,-s*0.63,s*0.07,0,7);x.fill();st()}
  else if(C.ears==='leaf'){x.fillStyle=F('#4cc26b');x.ellipse(-s*0.1,-s*0.5,s*0.07,s*0.17,-0.6,0,7);x.fill();st()}
  else if(C.ears==='fins'){x.moveTo(-s*0.36,-s*0.05);x.lineTo(-s*0.62,-s*0.22);x.lineTo(-s*0.4,s*0.12);x.closePath();x.fill();st()}
  x.restore()};
 ear(1);ear(-1);
 // pieds
 x.fillStyle=F(C.c);for(const m of [-1,1]){x.beginPath();x.ellipse(m*s*0.2,s*0.4,s*0.13,s*0.08,0,0,7);x.fill();st()}
 // corps
 x.fillStyle=F(C.c);x.beginPath();x.ellipse(0,0,s*0.42,s*0.42,0,0,7);x.fill();st();
 if(!sil){
  x.fillStyle=C.b;x.beginPath();x.ellipse(0,s*0.13,s*0.27,s*0.24,0,0,7);x.fill();
  x.save();x.beginPath();x.ellipse(0,0,s*0.42,s*0.42,0,0,7);x.clip();x.fillStyle='rgba(0,0,0,.12)';
  if(C.pat==='spots'){[[-0.26,-0.18],[0.28,-0.12],[0.3,0.2],[-0.32,0.16]].forEach(([a,b])=>{x.beginPath();x.arc(a*s,b*s,s*0.06,0,7);x.fill()})}
  if(C.pat==='stripes'){for(const a of [-0.12,0,0.12]){x.fillRect(a*s-s*0.025,-s*0.44,s*0.05,s*0.14)}}
  x.restore();
  // yeux
  for(const m of [-1,1]){const ex=m*s*0.15,ey=-s*0.08;
   if(C.eyes==='big'){x.fillStyle='#fff';x.beginPath();x.ellipse(ex,ey,s*0.09,s*0.11,0,0,7);x.fill();x.fillStyle='#1d1330';x.beginPath();x.ellipse(ex+s*0.01,ey+s*0.02,s*0.06,s*0.075,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(ex-s*0.015,ey-s*0.015,s*0.022,0,7);x.fill()}
   else{x.strokeStyle='#1d1330';x.lineWidth=s*0.035;x.beginPath();if(C.eyes==='happy')x.arc(ex,ey+s*0.02,s*0.055,Math.PI*1.1,Math.PI*1.9);else x.arc(ex,ey-s*0.02,s*0.055,Math.PI*0.1,Math.PI*0.9);x.stroke()}}
  x.fillStyle='rgba(255,120,150,.55)';for(const m of [-1,1]){x.beginPath();x.ellipse(m*s*0.26,s*0.05,s*0.055,s*0.035,0,0,7);x.fill()}
  x.strokeStyle='#1d1330';x.lineWidth=s*0.03;x.beginPath();x.moveTo(-s*0.05,s*0.06);x.quadraticCurveTo(-s*0.025,s*0.1,0,s*0.06);x.quadraticCurveTo(s*0.025,s*0.1,s*0.05,s*0.06);x.stroke();
 }
 x.restore()}
