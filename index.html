<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="description" content="Arcade pinball: 5 tables, missions, multiball.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Odyssée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Odyssée Pinball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@500;700&family=Doto:wght@800;900&family=Fredoka:wght@600&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: arcade cabinet, glossy and loud, every table a different world.
IDEA: a real pinball cabinet — dot-matrix display on top, lit playfield below, ramps in clear plastic.
PICTURE: the playfield itself, illustrated per theme (space, volcano, abyss, meadow).
COLOUR and TYPE: each table owns its palette; DMD dots in the table colour; Audiowide + Chakra Petch + Doto.
LAYOUT: DMD band, playfield filling the rest; menu of four cabinet cards.
*/
:root{color-scheme:dark;--dmd:#5fe0ff;--acc:#5fe0ff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:#050508;color:#eef1ff;font:16px/1.45 'Chakra Petch',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:
 linear-gradient(90deg,#16110c 0,#2a1f16 10px,#0c0a08 14px,transparent 15px,transparent calc(100% - 15px),#0c0a08 calc(100% - 14px),#2a1f16 calc(100% - 10px),#16110c 100%),
 radial-gradient(120% 70% at 50% 0,#1a1b2e 0,#07070c 70%)}
#dmd{position:relative;flex:none;height:68px;margin:max(4px,env(safe-area-inset-top)) 10px 2px;border-radius:10px;background:#0b0705;border:2px solid #2b2b33;box-shadow:inset 0 0 18px #000,0 2px 0 #3a3a44;overflow:hidden;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
#dmd::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;pointer-events:none;background:radial-gradient(circle,transparent 45%,#0b0705 72%) 0 0/4px 4px;opacity:.8}
.dmdc{text-align:center;color:var(--dmd);text-shadow:0 0 3px color-mix(in srgb,var(--dmd) 55%,transparent);-webkit-font-smoothing:antialiased;font-family:'Doto','VT323',ui-monospace,monospace;font-weight:900;line-height:1}
#dmdScore{font-size:30px;letter-spacing:1px;white-space:nowrap}
#dmdInfo{font:700 16px/1.1 'Chakra Petch',system-ui,sans-serif;margin-top:4px;white-space:nowrap;overflow:hidden;letter-spacing:.4px;text-shadow:none;color:color-mix(in srgb,var(--dmd) 80%,#fff)}
#dmdRow{display:flex;align-items:center;gap:8px;width:86%;margin:4px auto 0;opacity:0;transition:opacity .3s}#dmdRow.on{opacity:1}#dmdMeta{font:700 13px 'Chakra Petch',sans-serif;white-space:nowrap;text-shadow:none;color:color-mix(in srgb,var(--dmd) 80%,#fff)}
#dmdBar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--dmd) 18%,transparent);overflow:hidden;opacity:0;transition:opacity .3s}#dmdBar{opacity:1}#dmdBar i{display:block;height:100%;width:0;background:var(--dmd);box-shadow:0 0 8px var(--dmd);transition:width .25s}
#dmd{height:80px!important}
#dmdInfo.flash{animation:fl .25s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
.ib{position:relative;z-index:2;width:40px;height:40px;margin:0 2px;border:0;border-radius:8px;background:transparent;color:var(--dmd);font:700 18px 'Chakra Petch',sans-serif;cursor:pointer;opacity:.85}
.ib:focus-visible{outline:2px solid var(--dmd)}
#stage{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;perspective:1100px;perspective-origin:50% 30%;overflow:hidden;touch-action:none;padding-bottom:max(2px,env(safe-area-inset-bottom))}
#tilt{transform-origin:50% 100%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.v3d #tilt{transform:rotateX(17deg)}
#cv{display:block;border-radius:6px;box-shadow:0 0 0 3px #1c1c22,0 0 0 5px #3d3d48,0 30px 60px #000}
.hint{position:absolute;bottom:18px;width:44%;padding:10px;border-radius:12px;background:rgba(0,0,0,.45);border:1px dashed rgba(255,255,255,.3);font-size:13px;text-align:center;color:#dfe6ff;pointer-events:none;transition:opacity .8s}
.hint.l{left:3%}.hint.r{right:3%}.hint.off{opacity:0}
.ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;touch-action:pan-y;padding:max(16px,env(safe-area-inset-top)) 14px 28px;background:radial-gradient(90% 60% at 50% 0,#22183f 0,#0a0912 60%,#050508 100%)}
.ov.dim{background:rgba(4,4,10,.82);backdrop-filter:blur(6px);justify-content:center}
.hide{display:none!important}
h1{font:400 clamp(30px,8vw,52px)/1.02 'Audiowide',sans-serif;margin:6px 0 4px;text-align:center;background:linear-gradient(180deg,#fff 0,#9fe8ff 45%,#ff6fe0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(120,200,255,.35));text-wrap:balance}
.sub{margin:0 0 14px;color:#aab3d6;font-size:15px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,2.2vw,16px);width:100%;max-width:900px}
@media(max-width:640px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;padding:8px 8px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c);outline:none;box-shadow:0 0 24px color-mix(in srgb,var(--c) 35%,transparent)}
.card canvas{width:100%;aspect-ratio:500/1080;border-radius:8px;display:block;background:#000}
.card b{display:block;font:400 clamp(15px,3.8vw,20px)/1.1 'Audiowide',sans-serif;margin:8px 0 4px;color:var(--c)}
.tag{position:absolute;top:14px;left:14px;padding:3px 9px;border-radius:10px;background:#ffd23f;color:#3a2600;font:600 12px 'Fredoka','Chakra Petch',sans-serif}
.pips{display:flex;gap:4px;align-items:center;font-size:12px;color:#cfd6f5}
.pips i{width:clamp(10px,2.6vw,16px);height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.pips i.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.meta{font-size:12px;color:#9aa3c7;margin-top:4px;line-height:1.3}
.rec{font-size:13px;margin-top:4px;color:#fff;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.lbl{width:100%;text-align:center;font-size:13px;color:#9aa3c7;margin:6px 0 -2px}
.pill{min-height:44px;padding:0 15px;border-radius:22px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#dfe5ff;font:700 14px 'Chakra Petch',sans-serif;cursor:pointer}
.pill[aria-pressed=true]{background:#e9f6ff;color:#0a0a14;border-color:#e9f6ff}
.pill:focus-visible,.btn:focus-visible{outline:2px solid #9fe8ff;outline-offset:2px}
.help{max-width:560px;font-size:13px;color:#9aa3c7;text-align:center;margin-top:8px}
.help kbd{font:700 12px 'Chakra Petch',sans-serif;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.12);color:#fff}
.panel{width:min(380px,92vw);padding:22px 18px;border-radius:18px;background:linear-gradient(180deg,#171a2c,#0d0e18);border:1px solid rgba(255,255,255,.12);text-align:center;box-shadow:0 20px 60px #000}
.panel h2{font:400 25px/1.1 'Audiowide',sans-serif;margin:0 0 10px;color:var(--acc)}
.big{font:900 40px/1.1 'Doto',ui-monospace,monospace;color:var(--dmd);text-shadow:0 0 12px var(--dmd);margin:6px 0}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{min-height:48px;border-radius:12px;border:0;font:700 16px 'Chakra Petch',sans-serif;cursor:pointer;background:rgba(255,255,255,.08);color:#fff}
.btn.p{background:var(--acc);color:#05060c}
.newrec{color:#ffe45c;font-weight:700}
.coll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.coll div{background:rgba(255,255,255,.05);border-radius:10px;padding:4px 2px 6px;font:600 11px 'Fredoka',sans-serif;color:#dfe6ff}
.coll canvas{width:100%;aspect-ratio:1;display:block}
@media (prefers-reduced-motion:reduce){#tilt,.card{transition:none}}
</style>
</head>
<body>
<div id="app" class="v3d">
  <header id="dmd">
    <button class="ib" id="menuBtn" aria-label="Pause">II</button>
    <div class="dmdc"><div id="dmdScore">ODYSSÉE</div><div id="dmdInfo">CHOISIS UNE TABLE</div><div id="dmdRow"><div id="dmdBar"><i></i></div><span id="dmdMeta"></span></div></div>
    <button class="ib" id="sndBtn" aria-label="Son">♪</button>
  </header>
  <div id="stage">
    <div id="tilt"><canvas id="cv" width="500" height="1080"></canvas></div>
    <div class="hint l off" id="hintL" data-th="hintL">◀ Toucher ici<br>flipper gauche</div>
    <div class="hint r off" id="hintR" data-th="hintR">Toucher ici ▶<br>flipper droit · maintenir = lancer</div>
  </div>

  <section class="ov" id="menu">
    <h1>ODYSSÉE PINBALL</h1>
    <p class="sub" data-t="sub">Six tables, des missions, une seule physique.</p>
    <div class="row" style="margin-top:0"><button class="pill lg" data-lang="fr">Français</button><button class="pill lg" data-lang="en">English</button></div>
    <div class="cards" id="cards"></div>
    <div class="row">
      <div class="lbl" data-t="gravLbl">Gravité (moins forte = la bille descend plus lentement)</div>
      <button class="pill gv" data-g="1" data-t="gN">Normale</button>
      <button class="pill gv" data-g="0.7" data-t="gD">Douce</button>
      <button class="pill gv" data-g="0.5" data-t="gTD">Très douce</button>
    </div>
    <div class="row">
      <button class="pill" id="tSnd" aria-pressed="true" data-t="snd">Sons</button>
      <button class="pill" id="tMus" aria-pressed="true" data-t="mus">Musique</button>
      <button class="pill" id="t3d" aria-pressed="true" data-t="v3d">Vue 3D</button>
      <button class="pill" id="tLit" aria-pressed="true" data-t="lit">Lumières dynamiques</button>
      <button class="pill" id="tColl" data-t="coll">Collection de créatures</button>
    </div>
    <p class="help" id="help"></p>
  </section>

  <section class="ov dim hide" id="pause">
    <div class="panel">
      <h2 data-t="pause">Pause</h2>
      <div class="row" style="margin-top:4px">
        <button class="pill lg" data-lang="fr">Français</button><button class="pill lg" data-lang="en">English</button>
        <div class="lbl" data-t="grav">Gravité</div>
        <button class="pill gv" data-g="1" data-t="gN">Normale</button>
        <button class="pill gv" data-g="0.7" data-t="gD">Douce</button>
        <button class="pill gv" data-g="0.5" data-t="gTD">Très douce</button>
      </div>
      <div class="row">
        <button class="pill" id="pSnd" aria-pressed="true" data-t="snd">Sons</button>
        <button class="pill" id="pMus" aria-pressed="true" data-t="mus">Musique</button>
        <button class="pill" id="p3d" aria-pressed="true" data-t="v3d">Vue 3D</button>
        <button class="pill" id="pLit" aria-pressed="true" data-t="lit2">Lumières</button>
      </div>
      <div class="btns">
        <button class="btn p" id="resume" data-t="resume">Reprendre</button>
        <button class="btn" id="restart" data-t="restart">Recommencer</button>
        <button class="btn" id="toMenu" data-t="change">Changer de table</button>
      </div>
    </div>
  </section>

  <section class="ov dim hide" id="over">
    <div class="panel">
      <h2 id="overT">Partie terminée</h2>
      <div class="big" id="overS">0</div>
      <div id="overG" class="meta" style="font-size:15px;color:#fff"></div>
      <div id="overR" class="meta"></div>
      <div class="btns">
        <button class="btn p" id="again" data-t="again">Rejouer</button>
        <button class="btn" id="over2menu" data-t="change">Changer de table</button>
      </div>
    </div>
  </section>

  <section class="ov dim hide" id="collOv">
    <div class="panel" style="width:min(460px,94vw)">
      <h2 style="color:#ffd23f">Collection</h2>
      <div class="meta" id="collN"></div>
      <div class="coll" id="collGrid"></div>
      <div class="btns"><button class="btn p" id="collClose" style="background:#ffd23f" data-t="close">Fermer</button></div>
    </div>
  </section>
</div>

const CN={x:0,y:0};
function colSeg(b,s){const dx=s.bx-s.ax,dy=s.by-s.ay,l2=dx*dx+dy*dy;let t=((b.x-s.ax)*dx+(b.y-s.ay)*dy)/l2;t=t<0?0:t>1?1:t;
 const px=s.ax+dx*t,py=s.ay+dy*t;let nx=b.x-px,ny=b.y-py;const d2=nx*nx+ny*ny,mn=R+s.r;if(d2>=mn*mn)return -1;
 const d=Math.sqrt(d2)||1e-4;nx/=d;ny/=d;let vn=b.vx*nx+b.vy*ny;
 if(s.oneWay){if((b.x-s.ax)*s.nx+(b.y-s.ay)*s.ny<0||vn>0)return -1}
 b.x=px+nx*mn;b.y=py+ny*mn;CN.x=nx;CN.y=ny;
 if(vn<0){b.vx-=(1+s.e)*vn*nx;b.vy-=(1+s.e)*vn*ny;const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty;b.vx-=vt*0.004*tx;b.vy-=vt*0.004*ty;return -vn}return 0}
function colCirc(b,c,kick){const nx0=b.x-c.x,ny0=b.y-c.y,d2=nx0*nx0+ny0*ny0,mn=R+c.r;if(d2>=mn*mn)return -1;const d=Math.sqrt(d2)||1e-4,nx=nx0/d,ny=ny0/d;
 b.x=c.x+nx*mn;b.y=c.y+ny*mn;const rvx=b.vx-(c.vx||0),rvy=b.vy;let vn=rvx*nx+rvy*ny;const imp=-vn;
 if(vn<0){b.vx-=(1+c.e)*vn*nx;b.vy-=(1+c.e)*vn*ny}
 if(kick){const v2=b.vx*nx+b.vy*ny;if(v2<BUMP_OUT){b.vx+=(BUMP_OUT-v2)*nx;b.vy+=(BUMP_OUT-v2)*ny}}
 return Math.max(0,imp)}
function colFlip(b,f){const ex=f.px+Math.cos(f.th)*f.len,ey=f.py+Math.sin(f.th)*f.len,dx=ex-f.px,dy=ey-f.py;
 let t=((b.x-f.px)*dx+(b.y-f.py)*dy)/(f.len*f.len);t=t<0?0:t>1?1:t;const px=f.px+dx*t,py=f.py+dy*t,rr=f.r1+(f.r2-f.r1)*t;
 let nx=b.x-px,ny=b.y-py;const d2=nx*nx+ny*ny,mn=R+rr;if(d2>=mn*mn)return;const d=Math.sqrt(d2)||1e-4;nx/=d;ny/=d;
 b.x=px+nx*mn;b.y=py+ny*mn;const cx=b.x-nx*R-f.px,cy=b.y-ny*R-f.py,ux=-f.om*cy,uy=f.om*cx;

function rampPos(rp,s){const c=rp.cum;let i=1;while(i<c.length-1&&c[i]<s)i++;const t=(s-c[i-1])/((c[i]-c[i-1])||1),a=rp.P[i-1],b=rp.P[i];return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function rampRide(b,h){const r=b.ramp,rp=r.rp;r.v=Math.max(900,Math.min(1600,r.v-(r.s<rp.len*0.45?350:-450)*h));r.s+=r.v*h;
 if(r.s>=rp.len){const P=rp.P,a=P[P.length-3],c=P[P.length-1],dx=c[0]-a[0],dy=c[1]-a[1],l=Math.hypot(dx,dy)||1;b.x=c[0];b.y=c[1];b.vx=dx/l*rp.exitSpd;b.vy=dy/l*rp.exitSpd;b.ramp=null;rampDone(rp,b);return}
 const p=rampPos(rp,r.s);b.vx=(p[0]-b.x)/h;b.vy=(p[1]-b.y)/h;b.x=p[0];b.y=p[1];r.z=rampZ(rp,r.s)}
function rampZ(rp,s){const c=rp.cum;let i=1;while(i<c.length-1&&c[i]<s)i++;const t=(s-c[i-1])/((c[i]-c[i-1])||1);return rp.Z[i-1]+(rp.Z[i]-rp.Z[i-1])*t}

function step(h){

 for(const f of T.flippers){const tg=f.active?FL_UP:FL_REST,old=f.a,sp=f.active?FL_UPSPD:FL_DNSPD;
  if(f.a>tg)f.a=Math.max(tg,f.a-sp*h);else if(f.a<tg)f.a=Math.min(tg,f.a+sp*h);const da=(f.a-old)/h;f.th=f.right?Math.PI-f.a:f.a;f.om=f.right?-da:da}

 const py=PLUNGER_Y+G.pull*26;T.plunger.ay=T.plunger.by=py;

 for(const b of bs){if(b.cap>0||b.gone)continue;
  if(b.ramp){rampRide(b,h);continue}
  b.vy+=g*h;b.x+=b.vx*h;b.y+=b.vy*h;
  for(const s of T.segs){if(s.off)continue;const imp=colSeg(b,s);if(imp<0)continue;if(s.hit)s.hit(b,imp,CN);else if(imp>260&&T.t-lastWall>0.05){lastWall=T.t;SFX.wall(imp)}}
  for(const p of T.posts){const imp=colCirc(b,p,false);if(imp>260&&T.t-lastWall>0.05){lastWall=T.t;SFX.wall(imp)}}
  for(const bp of T.bumpers){const imp=colCirc(b,{x:bp.x,y:bp.y,r:bp.r,e:0.5},true);if(imp>=0&&bp.cd<=0){bp.cd=0.06;bumpHit(bp,b)}}
  if(T.mover){const m=T.mover,imp=colCirc(b,{x:m.x,y:m.y,r:m.r,e:0.5,vx:m.vx},true);if(imp>=0&&m.cd<=0){m.cd=0.08;m.flash=1;add(300,m.x,m.y-24);G.bonus+=100;SFX.bump();burst(b.x,b.y,T.th.a2,10,300);misEvent('bump')}}
  for(const f of T.flippers)colFlip(b,f);
  if(T.whirl){const w=T.whirl,dx=b.x-w.x,dy=b.y-w.y,d=Math.hypot(dx,dy);if(d<w.r&&d>1){const nx=dx/d,ny=dy/d,k=1-d/w.r,at=900+1800*k;b.vx+=(-ny*at-nx*420*k)*h;b.vy+=(nx*at-ny*420*k)*h;w.in=0.3;if(w.cd<=0){w.cd=0.12;add(50);misEvent('whirl')}}}

 c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.arc(x+1,y+1,cr,0,7);c.fill();c.fillStyle=cg;c.beginPath();c.arc(x,cy,cr,0,7);c.fill();
 c.fillStyle=col2;c.translate(x,cy);
 if(kind==='nebula'){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?cr*0.22:cr*0.55;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fill()}
 else if(kind==='volcan'){c.beginPath();c.moveTo(0,-cr*0.6);c.quadraticCurveTo(cr*0.5,-cr*0.05,cr*0.25,cr*0.45);c.quadraticCurveTo(0,cr*0.6,-cr*0.25,cr*0.45);c.quadraticCurveTo(-cr*0.5,-cr*0.05,0,-cr*0.6);c.fill()}
 else if(kind==='abyss'){c.strokeStyle=col2;c.lineWidth=2;c.beginPath();for(let a=0;a<9;a+=0.25){const rr=1+a*cr*0.06;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.stroke()}
 else{c.beginPath();c.arc(0,0,cr*0.35,0,7);c.fill()}
 c.restore();
 if(fl>0.02){c.save();c.globalCompositeOperation='lighter';c.globalAlpha=fl;const gr=r*3.4;c.drawImage(glow(col),x-gr,y-gr,gr*2,gr*2);c.restore()}
}
function drawFlipper(c,f,th){
 const ex=f.px+Math.cos(f.th)*f.len,ey=f.py+Math.sin(f.th)*f.len,a=f.th;
 const path=(ox,oy,k=0)=>{c.beginPath();c.arc(f.px+ox,f.py+oy,f.r1+k,a+Math.PI/2,a+Math.PI*1.5);c.arc(ex+ox,ey+oy,f.r2+k,a-Math.PI/2,a+Math.PI/2);c.closePath()};
 c.fillStyle='rgba(0,0,0,.45)';path(4,7,1);c.fill();
 c.fillStyle=th.rubber;path(0,0,1.2);c.fill();
 const g=c.createLinearGradient(f.px-Math.sin(a)*12,f.py+Math.cos(a)*12,f.px+Math.sin(a)*12,f.py-Math.cos(a)*12);g.addColorStop(0,'#9aa2b3');g.addColorStop(0.5,'#ffffff');g.addColorStop(1,'#d5dae6');c.fillStyle=g;path(0,0,-1.6);c.fill();
 c.fillStyle=th.a1;c.globalAlpha=0.6;c.beginPath();c.arc(f.px+Math.cos(a)*f.len*0.55,f.py+Math.sin(a)*f.len*0.55,2.5,0,7);c.fill();c.globalAlpha=1;
 c.fillStyle='#5a6070';c.beginPath();c.arc(f.px,f.py,4,0,7);c.fill();c.fillStyle='#dfe4ee';c.beginPath();c.arc(f.px-1,f.py-1,2,0,7);c.fill();
}
function drawBall(c,b,th){
 const z=b.ramp?b.ramp.z:0;let r=R*(1+0.32*z),x=b.x,y=b.y;if(b.cap>0)r=R*0.82;
 const sp=b.ramp?b.ramp.v:Math.hypot(b.vx,b.vy);
 if(sp>1200&&b.cap<=0&&!b.ramp){c.save();c.globalCompositeOperation='lighter';c.globalAlpha=Math.min(0.35,(sp-1200)/4000);c.strokeStyle=th.a1;c.lineWidth=R*1.6;c.lineCap='round';c.beginPath();c.moveTo(x,y);c.lineTo(x-b.vx*0.02,y-b.vy*0.02);c.stroke();c.restore()}
 c.fillStyle=`rgba(0,0,0,${0.4-0.15*z})`;c.beginPath();c.ellipse(x+4+z*10,y+6+z*14,r*1.05,r*0.9,0,0,7);c.fill();
 const g=c.createRadialGradient(x-r*0.35,y-r*0.45,r*0.08,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(0.22,'#eef2f8');g.addColorStop(0.65,'#8a94a5');g.addColorStop(1,'#272b33');
 c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();
 c.save();c.beginPath();c.arc(x,y,r,0,7);c.clip();c.globalAlpha=0.35;c.fillStyle=th.a1;c.beginPath();c.ellipse(x,y+r*0.75,r*0.95,r*0.4,0,0,7);c.fill();c.restore();
 c.fillStyle='rgba(255,255,255,.95)';c.beginPath();c.ellipse(x-r*0.38,y-r*0.42,r*0.22,r*0.14,-0.6,0,7);c.fill();
}

/* ================= TAILLE ================= */
function fit(){const st=$('stage');const pb=parseFloat(getComputedStyle(st).paddingBottom)||0,aw=st.clientWidth-4,ah=st.clientHeight-pb-2;const v3=$('app').classList.contains('v3d');
 const dpr=Math.min(2.75,(window.devicePixelRatio||1)*(v3?1.15:1)),maxH=aw*H/W;let ch=Math.min(ah,maxH);
 const apply=()=>{const cw=Math.floor(ch*W/H);cv.style.width=cw+'px';cv.style.height=Math.floor(ch)+'px'};apply();
 if(v3){for(let k=0;k<4;k++){const r=cv.getBoundingClientRect();if(!r.height)break;const n=Math.min(maxH,ch*ah/r.height);if(Math.abs(n-ch)<1)break;ch=n;apply()}}
 const s=Math.floor(ch)/H;SC=s;VIEWH=H;cv.width=Math.round(Math.floor(ch*W/H)*dpr);cv.height=Math.round(Math.floor(ch)*dpr);VS=cv.width/W;camY=0;if(T){BG=prerender(T,VS,'bg');FG=prerender(T,VS,'fg')}}
function camUpdate(dt){if(!G)return;let my=-1;for(const b of G.balls)if(!b.gone)my=Math.max(my,b.y);const maxC=Math.max(0,H-VIEWH);let ty=my<0||G.wait>0?maxC:Math.max(0,Math.min(maxC,my-VIEWH*0.62));camY+=(ty-camY)*Math.min(1,dt*5)}
addEventListener('resize',()=>{fit()});

/* ================= ENTRÉES ================= */
function setFlip(i,on){if(state!=='play'||paused||!T)return;const f=T.flippers[i];if(f.active===on)return;for(const g of T.flippers)if(g.side===i)g.active=on;
 if(on){SFX.flip();if(G&&!G.laneFlash){const l=T.lanes.map(l=>l.lit);if(i===0)l.push(l.shift());else l.unshift(l.pop());T.lanes.forEach((ln,k)=>ln.lit=l[k])}}else SFX.flipDn()}
function setPlunger(on){if(state!=='play'||paused||!G)return;const inLane=G.balls.some(b=>b.x>448&&b.y>PLUNGER_Y-80&&b.cap<=0);
 if(on){if(inLane&&!G.pulling)G.pulling=true}
 else if(G.pulling){G.pulling=false;const p=G.pull;for(const b of G.balls)if(b.x>448&&b.y>PLUNGER_Y-60){b.y=Math.min(b.y,PLUNGER_Y-R-3);b.vy=-(PLUNGE_MIN+p*(PLUNGE_MAX-PLUNGE_MIN))*Math.sqrt(GMUL);b.vx=0}if(p>0.02)SFX.launch(p);G.pull=0}}
const KL=['ArrowLeft','KeyZ','ShiftLeft','KeyA'],KR=['ArrowRight','KeyM','ShiftRight','Slash','KeyL'],KP=['Space','ArrowDown','Enter'];
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.code;
 if(KL.includes(k)){setFlip(0,true);e.preventDefault()}
 else if(KR.includes(k)){setFlip(1,true);e.preventDefault()}
 else if(KP.includes(k)&&state==='play'){setPlunger(true);e.preventDefault()}
 else if(k==='KeyP'||k==='Escape')togglePause()});
addEventListener('keyup',e=>{const k=e.code;if(KL.includes(k))setFlip(0,false);else if(KR.includes(k))setFlip(1,false);else if(KP.includes(k))setPlunger(false)});
const ptrs=new Map(),stage=$('stage');
stage.addEventListener('pointerdown',e=>{if(state!=='play')return;e.preventDefault();auInit();const side=e.clientX<innerWidth/2?0:1;ptrs.set(e.pointerId,side);try{stage.setPointerCapture(e.pointerId)}catch(_){}
 setFlip(side,true);if(side===1)setPlunger(true)});
const up=e=>{if(!ptrs.has(e.pointerId))return;const side=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(![...ptrs.values()].includes(side)){setFlip(side,false);if(side===1)setPlunger(false)}};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);stage.addEventListener('lostpointercapture',up);
stage.addEventListener('contextmenu',e=>e.preventDefault());

function togglePause(force){if(state!=='play')return;paused=force!=null?force:!paused;$('pause').classList.toggle('hide',!paused);if(paused){T.flippers.forEach(f=>f.active=false);G.pulling=false;G.pull=0;if(AU.roll)AU.roll.g.gain.value=0;syncToggles();$('resume').focus()}}
$('menuBtn').onclick=()=>{if(state==='play')togglePause(true)};
$('resume').onclick=()=>togglePause(false);
$('restart').onclick=()=>startGame(curDef);
$('again').onclick=()=>startGame(curDef);
const toMenu=()=>{snapClear();state='menu';paused=false;musicStop();if(AU.roll)AU.roll.g.gain.value=0;['pause','over'].forEach(i=>$(i).classList.add('hide'));buildMenu();$('menu').classList.remove('hide');$('dmdScore').textContent='ODYSSÉE';$('dmdInfo').textContent=dmdTr('CHOISIS UNE TABLE');$('dmdInfo').classList.remove('flash');$('dmdRow').classList.remove('on');$('dmdInfo').style.fontSize='';dmdLast='';document.documentElement.style.setProperty('--dmd','#5fe0ff')};
$('toMenu').onclick=toMenu;$('over2menu').onclick=toMenu;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused)togglePause(true)});

function setSnd(v){AU.on=v;SAVE.snd=v;persist();if(AU.sfx)AU.sfx.gain.value=v?1:0;syncToggles()}
function setMus(v){AU.music=v;SAVE.mus=v;persist();if(AU.mus)AU.mus.gain.value=v?0.16:0;syncToggles()}
function set3d(v){$('app').classList.toggle('v3d',v);SAVE.v3d=v;persist();syncToggles();if(T)fit()}
function setGrav(v){GMUL=v;SAVE.grav=v;persist();syncToggles()}
function syncToggles(){const v3=$('app').classList.contains('v3d');for(const [a,b,v] of [['tSnd','pSnd',AU.on],['tMus','pMus',AU.music],['t3d','p3d',v3],['tLit','pLit',LIT]]){$(a).setAttribute('aria-pressed',v);$(b).setAttribute('aria-pressed',v)}$('sndBtn').style.opacity=AU.on?0.9:0.35;
 document.querySelectorAll('.gv').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.g===GMUL))}
$('tSnd').onclick=$('pSnd').onclick=()=>{auInit();setSnd(!AU.on)};
$('tMus').onclick=$('pMus').onclick=()=>{auInit();setMus(!AU.music)};
$('tLit').onclick=$('pLit').onclick=()=>{LIT=!LIT;SAVE.lit=LIT;persist();syncToggles()};
$('t3d').onclick=$('p3d').onclick=()=>set3d(!$('app').classList.contains('v3d'));
$('sndBtn').onclick=()=>{auInit();setSnd(!AU.on)};
document.querySelectorAll('.gv').forEach(b=>b.onclick=()=>setGrav(+b.dataset.g));
$('tColl').onclick=()=>{const g=$('collGrid');g.innerHTML='';CREAT.forEach((C,i)=>{const has=SAVE.coll.includes(i);const d=document.createElement('div');const cvs=document.createElement('canvas');cvs.width=cvs.height=120;drawCreature(cvs.getContext('2d'),60,64,70,i,!has);d.appendChild(cvs);const n=document.createElement('span');n.textContent=has?C.n:'???';d.appendChild(n);g.appendChild(d)});
 $('collN').textContent=tr('collN',{a:SAVE.coll.length,b:CREAT.length});$('collOv').classList.remove('hide');$('collClose').focus()};
$('collClose').onclick=()=>$('collOv').classList.add('hide');
document.querySelectorAll('.lg').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem('odyssee-lang',LANG)}catch(e){}applyLang();if(T)fit();buildMenu();if(state==='menu'){$('dmdInfo').textContent=dmdTr('CHOISIS UNE TABLE')}dmdLast=''});


function snapSave(){try{if(state!=='play'||!G||!T)return;const bs=G.balls.filter(b=>!b.gone).map(b=>({x:b.x,y:b.y,vx:b.vx,vy:b.vy,cap:b.cap,live:b.live,noSave:b.noSave,ramp:b.ramp?{i:T.ramps.indexOf(b.ramp.rp),s:b.ramp.s,v:b.ramp.v}:null}));
 const g={};for(const k of ['score','ball','bonus','mult','saveT','multiball','extra','extraGiven','misDone','misIdx','mis','misCool','cr','caught','bumpLv','autoQ','autoT','wait','rampsMade','bestStreak','frenzyGiven','frenzyT','bq','blv','herseN','superHerse','extraN','drQ','drReady','drLv','drBeat'])g[k]=G[k];
 localStorage.setItem('odyssee-snap',JSON.stringify({v:1,id:T.def.id,ts:Date.now(),g,bs,lanes:T.lanes.map(l=>l.lit),drops:T.drops.map(d=>d.down),stands:T.standups.map(o=>o.lit),kicks:T.kicks.map(k=>[k.lit,k.rt])}))}catch(e){}}
function snapClear(){try{localStorage.removeItem('odyssee-snap')}catch(e){}}
function snapLoad(){try{const d=JSON.parse(localStorage.getItem('odyssee-snap')||'null');if(!d||d.v!==1||Date.now()-d.ts>12*3600e3)return false;const def=TABLES.find(x=>x.id===d.id);if(!def)return false;
 startGame(def);Object.assign(G,d.g);G.msgs=[];G.balls=d.bs.map(o=>{const b=newBall(o.x,o.y);Object.assign(b,o);b.ramp=null;if(o.ramp&&T.ramps[o.ramp.i]){b.ramp={rp:T.ramps[o.ramp.i],s:o.ramp.s,v:o.ramp.v,z:0}}return b});if(!G.balls.length&&G.wait<=0)serve();
 d.lanes.forEach((v,i)=>{if(T.lanes[i])T.lanes[i].lit=v});d.drops.forEach((v,i)=>{if(T.drops[i]){T.drops[i].down=v;T.drops[i].s.off=v}});d.stands.forEach((v,i)=>{if(T.standups[i])T.standups[i].lit=v});d.kicks.forEach((v,i)=>{if(T.kicks[i]){T.kicks[i].lit=v[0];T.kicks[i].rt=v[1]}});
 togglePause(true);return true}catch(e){return false}}
setInterval(snapSave,3000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)snapSave()});addEventListener('pagehide',snapSave);
/* ================= MENU ================= */
function buildMenu(){const box=$('cards');box.innerHTML='';
 TABLES.forEach(def=>{const b=document.createElement('button');b.className='card';b.style.setProperty('--c',def.theme.a1);
  const best=SAVE['hs_'+def.id]||0;
  b.innerHTML=`<canvas width="250" height="540"></canvas><b></b><div class="pips"><i></i><i></i><i></i><span></span></div><div class="meta"></div><div class="rec"></div>`;
  if(def.tag){const t=document.createElement('span');t.className='tag';t.textContent=nm(def.tag);b.appendChild(t)}
  b.querySelector('b').textContent=nm(def.name);b.querySelectorAll('.pips i').forEach((p,i)=>p.classList.toggle('on',i<def.level));b.querySelector('.pips span').textContent=nm(def.diff);
  b.querySelector('.meta').textContent=`${def.balls} ${tr('balls')} · ${def.save?tr('saveS',{n:def.save}):tr('noSave')}`+(def.id==='meadow'?` · ${SAVE.coll.length}/${CREAT.length} ${tr('creaturesM')}`:'');
  b.querySelector('.rec').textContent=best?tr('record')+' '+fmt(best):tr('recNone');
  b.setAttribute('aria-label',`${nm(def.name)}, ${nm(def.diff)}`);
  b.onclick=()=>startGame(def);box.appendChild(b);
  const tc=b.querySelector('canvas'),tx=tc.getContext('2d'),tt=buildTable(def),ps=tc.width/W;tx.drawImage(prerender(tt,ps,'bg'),0,0);tx.setTransform(ps,0,0,ps,0,0);drawDynamic(tx,tt,null,'floor');tx.setTransform(1,0,0,1,0,0);tx.drawImage(prerender(tt,ps,'fg'),0,0);tx.setTransform(ps,0,0,ps,0,0);drawDynamic(tx,tt,null,'top')});
 const touch=matchMedia('(pointer:coarse)').matches;
 $('help').innerHTML=(touch?tr('helpTouch'):tr('helpKey'))+'<br>'+tr('helpMis');
 syncToggles()}

let last=performance.now();
function frame(now){const dt=Math.min(0.033,(now-last)/1000);last=now;if(state==='play'&&!paused&&T){update(dt);camUpdate(dt);spotUpdate(dt,now/1000)}if(state!=='menu')render();requestAnimationFrame(frame)}
const fontsReady=Promise.race([Promise.all([document.fonts.load('40px Audiowide'),document.fonts.load('700 12px "Chakra Petch"'),document.fonts.load('900 20px Doto'),document.fonts.load('600 20px Fredoka'),document.fonts.load('700 20px Cinzel')]).catch(()=>{}),new Promise(r=>setTimeout(r,1800))]);
applyLang();buildMenu();fontsReady.then(()=>{buildMenu();if(T)fit()});
setTimeout(()=>{if(state==='menu')snapLoad()},300);

setInterval(()=>{if(state==='play'&&!paused&&!document.hidden)wakeOn();else wakeOff()},2000);
window.PB={start:i=>startGame(TABLES[i]),get G(){return G},get T(){return T},get paused(){return paused},get state(){return state},setFlip,setPlunger,update:dt=>update(dt),setGrav};
}
